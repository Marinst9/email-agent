name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Run Tests
        run: |
          pytest

  postgres-integration:
    # Migrations and hybrid search against a real PostgreSQL with pgvector (the image docker-compose uses).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: email_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d email_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/email_agent
      TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/email_agent
      REQUIRE_CYRILLIC_FTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrations (up, down one, up again)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Integration tests
        run: pytest tests/test_knowledge_postgres.py -rs

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t email-agent:latest .
