[project]
name = "email-agent"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The standalone CLI asks for confirmation with input() inside its single-task async loop, on purpose.
"main.py" = ["ASYNC250"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["main.py"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.oauth2.*", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
